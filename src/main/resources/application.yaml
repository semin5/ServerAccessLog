spring:
  config:
    import:
      - optional:file:.env[.properties]
  application:
    name: Server Access Log
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/accesslog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  sql:
    init:
      mode: always
      continue-on-error: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:3006}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:}
  error:
    whitelabel:
      enabled: false
